services:
  mongodb:
    image: mongo:7
    container_name: plant-care-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - plant-care-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  plant-care-mongo-data:
